<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="GITHUB STATS"><title>GITHUB STATS</title><style>
  .sans{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
  .mono{font-family:'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace}
  .tw{fill:#fff;animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .blink{fill:#ff9f1c;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .sp{fill:#ffd27a;transform-box:fill-box;transform-origin:center;animation:sp 3.6s ease-in-out infinite}
  @keyframes sp{0%,100%{transform:scale(.35) rotate(0);opacity:.3}50%{transform:scale(1) rotate(45deg);opacity:1}}
  .shoot{opacity:0;animation:shoot 9s linear infinite}
  @keyframes shoot{0%{transform:translate(0,0);opacity:0}1%{opacity:1}9%{transform:translate(460px,160px);opacity:0}100%{transform:translate(460px,160px);opacity:0}}
  .ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
  @keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(3);opacity:0}}

      .grow{transform-box:fill-box;animation:grow 1.2s ease-out both}
      .gl{transform-origin:right}.gr{transform-origin:left}
      @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    </style>
    <defs>
      <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="420" y1="0" x2="780" y2="0">
        <stop offset="0" stop-color="#ff9f1c"/><stop offset=".5" stop-color="#ff5e7e"/><stop offset="1" stop-color="#f15bb5"/>
      </linearGradient>
      <linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9f1c" stop-opacity="0"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient>
      <linearGradient id="r" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f15bb5"/><stop offset="1" stop-color="#f15bb5" stop-opacity="0"/></linearGradient>
    </defs>
    <text class="mono" x="600" y="30" text-anchor="middle" font-size="16" fill="#8b80b0">// commits, streaks &amp; languages</text>
    <text class="sans" x="600" y="82" text-anchor="middle" font-size="34" font-weight="800" fill="url(#g)" textLength="360" lengthAdjust="spacing">GITHUB STATS</text>
    <rect class="grow gl" x="136" y="69" width="250" height="2" fill="url(#l)"/>
    <rect class="grow gr" x="814" y="69" width="250" height="2" fill="url(#r)"/>
    <g transform="translate(398 70) scale(0.9)"><path class="sp" d="M0,-7 L1.6,-1.6 L7,0 L1.6,1.6 L0,7 L-1.6,1.6 L-7,0 L-1.6,-1.6Z" style="animation-delay:0s"/></g><g transform="translate(802 70) scale(0.9)"><path class="sp" d="M0,-7 L1.6,-1.6 L7,0 L1.6,1.6 L0,7 L-1.6,1.6 L-7,0 L-1.6,-1.6Z" style="animation-delay:-1.8s"/></g></svg>
