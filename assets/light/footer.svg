<svg xmlns="http://www.w3.org/2000/svg" width="880" height="188" viewBox="0 0 880 188" role="img" aria-label="Got an idea? Let's build it. Get in touch: jaisaini4a@gmail.com"><title>Got an idea? Let's build it. Get in touch: jaisaini4a@gmail.com</title><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.fb{transform-box:fill-box}.au0{animation:au0 13s ease-in-out infinite alternate}@keyframes au0{to{transform:translate(-70px,40px) scale(1.18)}}.au1{animation:au1 17s ease-in-out infinite alternate}@keyframes au1{to{transform:translate(80px,-30px) scale(1.18)}}.bm0{stroke-dasharray:190 1917.96;stroke-dashoffset:190;animation:bm0 7s linear infinite}@keyframes bm0{to{stroke-dashoffset:-1917.96}}.bm1{stroke-dasharray:110 1997.96;stroke-dashoffset:110;animation:bm1 7s linear infinite}@keyframes bm1{to{stroke-dashoffset:-1997.96}}.bm2{stroke-dasharray:44 2063.96;stroke-dashoffset:44;animation:bm2 7s linear infinite}@keyframes bm2{to{stroke-dashoffset:-2063.96}}
      .nudge{animation:nudge 2.4s ease-in-out infinite}
      @keyframes nudge{0%,55%,100%{transform:translateX(0)}78%{transform:translateX(5px)}}
      .halo{transform-origin:center;animation:halo 2.4s ease-out infinite}
      @keyframes halo{0%{transform:scale(1);opacity:.55}80%,100%{transform:scale(1.16,1.55);opacity:0}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.bm{display:none}}
    </style>
    <defs><clipPath id="frame"><rect width="880" height="188" rx="14"/></clipPath><radialGradient id="au0"><stop offset="0" stop-color="#0e7c86" stop-opacity="0.16"/><stop offset="1" stop-color="#0e7c86" stop-opacity="0"/></radialGradient><radialGradient id="au1"><stop offset="0" stop-color="#1a7f37" stop-opacity="0.16"/><stop offset="1" stop-color="#1a7f37" stop-opacity="0"/></radialGradient></defs>
    <rect x="0.5" y="0.5" width="879" height="187" rx="14" fill="#ffffff" stroke="#d1d9e0"/>
    <g clip-path="url(#frame)"><circle class="fb au0" cx="760" cy="30" r="260" fill="url(#au0)" style="transform-origin:center"/><circle class="fb au1" cx="180" cy="220" r="240" fill="url(#au1)" style="transform-origin:center"/></g>
    <rect class="bm bm0" x=".5" y=".5" width="879" height="187" rx="14" fill="none" stroke="#0e7c86" stroke-opacity="0.16" stroke-width="2.5" stroke-linecap="round"/><rect class="bm bm1" x=".5" y=".5" width="879" height="187" rx="14" fill="none" stroke="#0e7c86" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/><rect class="bm bm2" x=".5" y=".5" width="879" height="187" rx="14" fill="none" stroke="#0e7c86" stroke-opacity="1" stroke-width="1.5" stroke-linecap="round"/>
    <text class="s" x="44" y="92" font-size="36" font-weight="800" letter-spacing="-.9" fill="#1f2328">Got an idea? Let's build it.</text>
